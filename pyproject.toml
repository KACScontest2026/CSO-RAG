[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "cso-evidence-rag"
version = "0.1.0"
description = "Local paragraph-level C/S/O classification with evidence-enriched RAG"
requires-python = ">=3.12"
dependencies = ["jsonschema==4.26.0"]
[project.optional-dependencies]
retrieval = ["numpy==2.5.3", "chromadb==1.5.9", "sentence-transformers==5.7.0", "transformers==4.57.6"]
generation = ["llama-cpp-python==0.3.36", "jinja2==3.1.6"]
test = ["regex"]
[project.scripts]
cso-rag = "cso_rag.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
